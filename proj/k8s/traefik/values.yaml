providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: false

service:
  spec:
    type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30080

  websecure:
    port: 8443
    exposedPort: 443
    nodePort: 30443

gateway:
  enabled: true
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All

    websecure:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: localhost-wildcard-tls
          namespace: cert-manager

gatewayClass:
  enabled: true
