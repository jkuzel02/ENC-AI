apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: localhost-wildcard-tls
  namespace: cert-manager
spec:
  secretName: localhost-wildcard-tls
  dnsNames:
    - "*.localhost"
    - localhost
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
