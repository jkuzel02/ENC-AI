apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux
  namespace: flux-system
spec:
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - flux.localhost

  rules:
    - backendRefs:
        - kind: Service
          name: flux-operator
          port: 9080
