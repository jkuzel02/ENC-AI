apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - grafana.localhost

  rules:
    - backendRefs:
        - kind: Service
          name: monitoring-grafana
          port: 80

