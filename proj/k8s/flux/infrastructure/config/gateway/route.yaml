apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-2-https-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: traefik-gateway
      sectionName: web
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
