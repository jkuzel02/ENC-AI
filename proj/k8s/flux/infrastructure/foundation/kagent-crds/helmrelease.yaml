apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: flux-system
spec:
  maxHistory: 1

  chart:
    spec:
      chart: kagent-crds
      sourceRef:
        kind: HelmRepository
        name: kagent
      version: "0.10.3"
  
  releaseName: kagent-crds
  targetNamespace: kagent
  
  install:
    crds: Create
  upgrade:
    crds: CreateReplace

  interval: 10m
  timeout: 3m
