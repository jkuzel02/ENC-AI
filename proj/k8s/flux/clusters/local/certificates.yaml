apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager

  sourceRef:
    kind: GitRepository
    name: enc-ai
  path: ./proj/k8s/flux/infrastructure/config/certificates

  prune: true
  wait: true

  interval: 1m
  timeout: 3m
