apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: foundation

  sourceRef:
    kind: GitRepository
    name: enc-ai
  path: ./proj/k8s/flux/infrastructure/controllers/cert-manager

  prune: true
  wait: true

  interval: 10m
  timeout: 3m
