# Using Helm Repository instead of OCIRpository - https://github.com/kagent-dev/kagent/issues/695
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kagent
  namespace: flux-system
spec:
  type: oci
  url: oci://ghcr.io/kagent-dev/kagent/helm
  interval: 3m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  url: https://traefik.github.io/charts
  interval: 3m
