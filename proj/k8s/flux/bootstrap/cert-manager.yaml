apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager

  releaseName: cert-manager
  targetNamespace: cert-manager

  install:
    crds: Create
  upgrade:
    crds: CreateReplace

  interval: 3m
  timeout: 3m

  values:
    crds:
      enabled: true
    
    config:
      gatewayAPI:
        enabled: true
