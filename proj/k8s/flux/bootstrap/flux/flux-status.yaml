apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-status
  namespace: flux-system
spec:
  hostnames:
    - flux.localhost
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - backendRefs:
        - kind: Service
          name: flux-operator
          port: 9080
      matches:
        - path:
            type: PathPrefix
            value: /