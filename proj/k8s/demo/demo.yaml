
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: enc-ai
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/jkuzel02/ENC-AI/
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: enc-ai
  path: ./proj/k8s/demo/kustomize
  targetNamespace: demo
  prune: true
  wait: true
  interval: 1m
  timeout: 3m
