apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-config
  namespace: kube-system
data:
  10-kindnet.conflist: |
    {
      "cniVersion": "0.3.1",
      "name": "kindnet",
      "plugins": [
        {
          "type": "nonexistent-cni-plugin",
          "bridge": "cni0",
          "ipam": {
            "type": "host-local",
            "subnet": "10.244.0.0/24"
          }
        }
      ]
    }
