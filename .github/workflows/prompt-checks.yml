name: RCA prompt checks

on:
  pull_request:
    paths:
      - 'proj/prompts/**'
      - 'proj/examples/**'
      - 'proj/prompt_checks/**'
      - '.github/workflows/prompt-checks.yml'
  push:
    branches: [main]
    paths:
      - 'proj/prompts/**'
      - 'proj/examples/**'
      - 'proj/prompt_checks/**'
      - '.github/workflows/prompt-checks.yml'
  workflow_dispatch:
    inputs:
      case:
        description: 'Incident ID (01–15); leave empty to evaluate all cases'
        type: string
        default: '01'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r proj/prompt_checks/requirements.txt
      - run: python -m unittest discover -s proj/prompt_checks -v

  live:
    needs: offline
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.RCA_LIVE_PROMPT_CHECKS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: rca-live-prompt-checks
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r proj/prompt_checks/requirements.txt
      - name: Evaluate prompts on e-INFRA CZ
        env:
          LLM_AI_EINFRA_API_KEY: ${{ secrets.LLM_AI_EINFRA_API_KEY }}
          LLM_AI_EINFRA_MODEL: ${{ vars.LLM_AI_EINFRA_MODEL }}
          CASE_ID: ${{ inputs.case }}
        run: |
          args=(--output "${RUNNER_TEMP}/prompt-results.json")
          if [[ -n "$CASE_ID" ]]; then
            args+=(--case "$CASE_ID")
          fi
          python -m proj.prompt_checks.run "${args[@]}"
      - name: Upload prompt results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rca-prompt-results
          path: ${{ runner.temp }}/prompt-results.json
          if-no-files-found: ignore
